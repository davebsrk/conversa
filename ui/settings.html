<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajustes de Conversa</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5f3; --card: #ffffff; --line: #e9edef; --fg: #111b21; --muted: #667781;
    --accent: #059669; --accent-fg: #ffffff; --off: #8a8a8a; --error: #c42b1c; --hover: rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161717; --card: #1f2121; --line: #2e3131; --fg: #e9edef; --muted: #a5adb2;
            --accent: #34d399; --accent-fg: #002619; --off: #9e9e9e; --error: #ff99a4; --hover: rgba(255,255,255,.08); }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
         padding: 0 16px 16px; user-select: none; border-right: 1px solid var(--line); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px;
           background: var(--bg); margin: 0 -16px; padding: 14px 12px 10px; }
  h1 { font: 600 20px/1.3 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  #back { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%;
          background: transparent; color: var(--fg); }
  #back:hover { background: var(--hover); filter: none; }
  h2 { font-size: 14px; font-weight: 600; margin: 18px 4px 8px; }
  .group { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; min-height: 56px; }
  .row + .row { border-top: 1px solid var(--line); }
  .text { flex: 1; }
  .text small { display: block; color: var(--muted); font-size: 12px; }
  .row.disabled .text { opacity: .5; }

  /* Interruptor estilo Windows 11 */
  .switch { position: relative; width: 40px; height: 20px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border: 1px solid var(--off); border-radius: 10px; pointer-events: none; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%;
                        background: var(--off); transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + span::after { background: var(--accent-fg); transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--fg); outline-offset: 2px; }

  select, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
  button { cursor: pointer; }
  button:hover { filter: brightness(.96); }
  kbd { font: 12px "Segoe UI", system-ui; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  #status { min-height: 20px; margin: 12px 4px 0; font-size: 12px; color: var(--muted); }
  #status.error { color: var(--error); }
</style>
</head>
<body>
  <header>
    <button id="back" type="button" aria-label="Volver" title="Volver (Esc)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h1>Ajustes de Conversa</h1>
  </header>

  <h2>Inicio</h2>
  <div class="group">
    <label class="row">
      <div class="text">Iniciar con el sistema<small>Conversa se abre al encender el ordenador.</small></div>
      <div class="switch"><input type="checkbox" id="autostart"><span></span></div>
    </label>
    <label class="row" id="startHiddenRow">
      <div class="text">Empezar oculta en la bandeja<small>Al iniciar con el sistema, sin abrir la ventana.</small></div>
      <div class="switch"><input type="checkbox" id="startHidden"><span></span></div>
    </label>
  </div>

  <h2>Apariencia</h2>
  <div class="group">
    <div class="row">
      <label class="text" for="zoom">Tamaño del texto<small>Agranda o reduce todo WhatsApp.</small></label>
      <select id="zoom">
        <option value="0.8">80 %</option>
        <option value="0.9">90 %</option>
        <option value="1">100 %</option>
        <option value="1.1">110 %</option>
        <option value="1.25">125 %</option>
        <option value="1.5">150 %</option>
        <option value="1.75">175 %</option>
        <option value="2">200 %</option>
      </select>
    </div>
  </div>

  <h2>Privacidad</h2>
  <div class="group">
    <label class="row">
      <div class="text">Desenfocar chats y mensajes<small>Se ven al pasar el ratón por encima. Útil si compartes pantalla o hay gente alrededor.</small></div>
      <div class="switch"><input type="checkbox" id="privacyBlur"><span></span></div>
    </label>
  </div>

  <h2>Ventana</h2>
  <div class="group">
    <label class="row">
      <div class="text">Al cerrar, mantener en la bandeja<small>Si lo desactivas, cerrar la ventana sale de Conversa y dejarás de recibir mensajes.</small></div>
      <div class="switch"><input type="checkbox" id="closeToTray"><span></span></div>
    </label>
    <label class="row">
      <div class="text">Atajo para mostrar u ocultar<small><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>W</kbd> desde cualquier aplicación.</small></div>
      <div class="switch"><input type="checkbox" id="globalShortcut"><span></span></div>
    </label>
  </div>

  <h2>Notificaciones</h2>
  <div class="group">
    <label class="row">
      <div class="text">Mostrar el texto del mensaje<small>Si lo desactivas, solo verás quién te escribe.</small></div>
      <div class="switch"><input type="checkbox" id="messagePreview"><span></span></div>
    </label>
  </div>

  <h2>Actualizaciones</h2>
  <div class="group">
    <div class="row">
      <label class="text" for="updates">Versiones nuevas<small>Se comprueba al abrir Conversa y cada 6 horas.</small></label>
      <select id="updates">
        <option value="notify">Avisarme</option>
        <option value="auto">Instalar automáticamente</option>
        <option value="off">No buscar</option>
      </select>
    </div>
    <div class="row">
      <div class="text">Conversa <span id="version"></span></div>
      <button id="checkNow" type="button">Buscar ahora</button>
    </div>
  </div>

  <p id="status" role="status"></p>

<script>
  const invoke = window.__TAURI_INTERNALS__.invoke;
  const $ = (id) => document.getElementById(id);
  const toggles = ["startHidden", "closeToTray", "globalShortcut", "messagePreview", "privacyBlur"];
  const status = (text, error = false) => { $("status").textContent = text; $("status").className = error ? "error" : ""; };

  function syncStartHidden() {
    $("startHiddenRow").classList.toggle("disabled", !$("autostart").checked);
  }

  async function load() {
    const { settings, autostart, version } = await invoke("get_settings");
    $("autostart").checked = autostart;
    for (const id of toggles) $(id).checked = settings[id];
    $("updates").value = settings.updates;
    $("zoom").value = String(settings.zoom);
    $("version").textContent = version;
    syncStartHidden();
  }

  async function save() {
    syncStartHidden();
    const settings = Object.fromEntries(toggles.map((id) => [id, $(id).checked]));
    settings.updates = $("updates").value;
    settings.zoom = Number($("zoom").value);
    try {
      await invoke("save_settings", { settings, autostart: $("autostart").checked });
      status("Guardado");
    } catch (err) {
      status(String(err), true);
      await load();
    }
  }

  document.querySelectorAll("input, select").forEach((el) => el.addEventListener("change", save));
  $("checkNow").addEventListener("click", async () => {
    await invoke("check_updates");
    status("Buscando actualizaciones… te avisará una notificación.");
  });
  const close = () => invoke("close_settings");
  $("back").addEventListener("click", close);
  document.addEventListener("keydown", (event) => { if (event.key === "Escape") close(); });
  load().catch((err) => status(String(err), true));
</script>
</body>
</html>
