[package]
name = "conversa"
version = "0.1.7"
description = "Cliente de escritorio ligero para WhatsApp Web"
authors = ["Conversa contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/davebsrk/conversa"
edition = "2024"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# "unstable": varias webviews en una ventana (el panel de Ajustes).
tauri = { version = "2.12.3", features = ["image-png", "tray-icon", "unstable"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = { version = "2.5.3", features = ["deep-link"] }
tauri-plugin-updater = "2.13.3"
tauri-plugin-window-state = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_Graphics_Gdi",
    "Win32_System_Com_Urlmon",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
