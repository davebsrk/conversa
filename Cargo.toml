[package]
name = "conversa"
version = "0.1.0"
description = "Cliente de escritorio ligero para WhatsApp Web"
authors = ["Conversa contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/davebsrk/conversa"
edition = "2024"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-updater = "2.13.3"
tauri-plugin-window-state = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
webview2-com = "0.39.1"
windows = "0.62.2"
